<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>{% block title %}{{ APP_NAME|default:"LineOne" }}{% endblock %}</title>
  {% block meta %}{% endblock %}
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: dark; }
    body { background: #0b1220; }
    .icon { width: 1.25rem; height: 1.25rem; display: inline-block; vertical-align: middle; fill: currentColor; }
    .icon-lg { width: 1.75rem; height: 1.75rem; }
    @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .animate-bounce-slow { animation: bounce-slow 1.6s ease-in-out infinite; }
  </style>
</head>
<body class="text-slate-100 antialiased min-h-screen">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.2.6 3.4.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.8 21 3 13.2 3 3.4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.3.6 3.4.1.3 0 .7-.2 1l-2.3 2z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-9-2c0-1.7 1.3-3 3-3s3 1.3 3 3v2H9V6z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></symbol>
</svg>

{% if messages %}
<div class="max-w-3xl mx-auto px-4 pt-4 space-y-2">
  {% for m in messages %}
  <div class="rounded-xl px-4 py-3 text-sm
    {% if m.tags == 'error' %}bg-red-500/15 text-red-300 border border-red-500/30
    {% elif m.tags == 'success' %}bg-emerald-500/15 text-emerald-300 border border-emerald-500/30
    {% else %}bg-slate-700/40 text-slate-200 border border-slate-600/40{% endif %}">
    {{ m }}
  </div>
  {% endfor %}
</div>
{% endif %}

{% block body %}{% endblock %}
</body>
</html>
