{% extends "pranks/base.html" %}
{% block title %}Check your email — {{ APP_NAME|default:"LineOne" }}{% endblock %}
{% block body %}
<main class="mx-auto w-full max-w-md px-4 py-10 text-center">
  <svg class="icon icon-lg text-emerald-400"><use href="#i-mail"/></svg>
  <h1 class="mt-2 text-2xl font-extrabold">Check your email</h1>
  <p class="mt-2 text-sm text-slate-400">If an account exists with that email, a reset link is on its way.</p>
  <p class="mt-1 text-[10px] text-slate-600 font-mono">LINEONE-RESET-DONE-v1</p>
  <a href="{% url 'login' %}" class="mt-6 inline-block rounded-xl bg-slate-700 px-4 py-2 font-semibold">Back to login</a>
</main>
{% endblock %}
